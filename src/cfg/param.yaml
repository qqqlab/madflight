# =========================================================================================
#  Parameter List
# =========================================================================================
# This list is used to generate the cfg parametes, e.g. cfg.imu_cal_ax
#
# IMPORTANT
#
#  - ONLY add new parameters/options at end of the list (when reading an old config without the parameter, the new parameter will be set to the default defined here)
#  - NEVER rename, delete, insert or move parameters/options
#  - USE float or to 24 bit integers to stay compatible with MAVLink which always uses float (a float can represent all 24 bit integers plus sign: i.e. -16,777,216 to +16,777,216 inclusive)
#
#   name:     Parameter name - max 16 char long - lowercase a-z plus '_' only [required]
#   default:  Default value [required]
#   datatype: Only use float or int32_t [required]
#   type:     f=float, i=int32_t, e=enum, p=pin (numeric for ESP32/RP2, pinname e.g. PB3 for STM32)  [required]
#   options:  List of options for e(enum) - no spaces, max 16 char per option  [required for type=e]
#   comment:  Single line comment [optional]
#   since:    Parameter exist since madflight version [optional]

version: "2.4.2"

# Global enums
enum:
  FlightMode:
    datatype: "enum class FlightMode : uint32_t"
    options:
      - CUSTOM0
      - CUSTOM1
      - CUSTOM2
      - CUSTOM3
      - CUSTOM4
      - CUSTOM5
      - RATE           #copter
      - ANGLE          #copter
      - PLANE_MANUAL   #plane
      - PLANE_ROLL     #plane
      - PLANE_FBWA     #plane
      - COPTER_ALTHOLD #copter
  MF_FilterType:
    datatype: "enum class MF_FilterType : uint32_t"
    options:
      - NONE
      - PT1
      - PT2
      - PT3
      - BIQUAD
      - NOTCH

