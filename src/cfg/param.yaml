  pid:
    title: Proportional Integral Derivative Controller
    comment: |
      This is the brain of the flight controller. 
      
      **!!! Parameter changes can lead unpleasant surprises, you have been warned !!!**



      ### Selecting a different controller

      Use following procedure to change the selected `pid_gizmo` controller, to ensure the defaults of the new controller are applied.

      ```
      defaults pid              # this resets the pid values
      set pid_gizmo NEW_GIZMO   # select the new PID controller
      save                      # save parameters to EEPROM and reboot

      ...                       # wait for reboot

      dump pid                  # check that you now have default values for NEW_GIZMO PID controller
      set pid_xxx value         # change parameters as desired
      ```

      Note: If a `pid_xxx` parameter is -1 then the default value for the selected `pid_gizmo` is used.


      ### pid_gizmo BASIC

      This controller is a very basic PID rate controller. When in Angle Mode the angle error is converted to a desired rate which the controller tries to keep.

      Betaflight friends will notice that the default MF parameters are identical to the BF defaults. Yes, this is by design, so your BF PID setup should work with this controller. But this controller lacks all the fancy stuff BF offers.

      Supported FlightModes: RATE, ANGLE

      #### BASIC Controller Parameters and Default Values

      ```
      == General ==
      pid_i_limit       10  Integrator saturation level in % of output
      pid_angl_mult      5  Multiplicator to convert Angle Error to Rate Error

      == Roll ==
      pid_kp0            45  Roll Kp - same as BF default
      pid_ki0            80  Roll Ki - same as BF default
      pid_kd0            30  Roll Kd - same as BF default
      pid_rol_rate_lim  300  Roll rate limit in deg/sec for rate mode - BF default is 600
      pid_rol_angl_lim   30  Roll angle limit in deg for angle mode - DO NOT INCREASE OVER 70 OR YOU WILL CRASH DUE TO GIMBAL-LOCKS

      == Pitch == (default -1 means use Roll value) 
      pid_kp1            -1  Pitch Kp - BF default is 47
      pid_ki1            -1  Pitch Ki - BF default is 84
      pid_kd1            -1  Pitch Kd - BF default is 34
      pid_pit_rate_lim   -1  Pitch rate limit in deg/sec for rate mode - BF default is 600
      pid_pit_angl_lim   -1  Pitch angle limit in deg for angle mode - DO NOT INCREASE OVER 70 OR YOU WILL CRASH DUE TO GIMBAL-LOCKS

      == Yaw ==
      pid_kp2            45  Yaw Kp - same as BF default
      pid_ki2            80  Yaw Ki - same as BF default
      pid_kd2             0  Yaw Kd - same as BF default
      pid_yaw_rate_lim  160  Yaw rate limit in deg/sec for rate+angle modes 

      == D-Term Filter ==
      pid_filt0_type    PT1  D-Term filter type
      pid_filt0_freq     30  D-Term filter cutoff frequency [Hz]
      ```

      ### pid_gizmo EXPERIMENTAL

      As the name implies, this is a work in progress experimental PID controller for madflight.
      
      Limited flight testing has been done, so be prepared for surprises and hands-on trial-and-error work to improve this controller.

      Supported FlightModes: RATE, ANGLE, COPTER_ALTHOLD

      This controller is an extended version of the BASIC controller:

       - ANGLE: Added no drift yaw control when mag is present
       - COPTER_ALTHOLD: Copter Altitutde Hold Mode (start this mode from hover in ANGLE mode, not on ground)

       See file pid/GizmoPidEXPERIMENTAL.cpp for the config parameters of this controller.

